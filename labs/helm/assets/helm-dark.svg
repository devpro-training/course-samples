<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="470" fill="#0f172a"/>
  <text x="520" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Helm: a chart and its values become a release</text>

  <rect x="20" y="80" width="210" height="190" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="125" y="108" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Catalog</text>
  <text x="125" y="134" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">chart repository (index.yaml)</text>
  <text x="125" y="154" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">or OCI registry</text>
  <text x="125" y="184" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">shop-0.2.0.tgz</text>
  <text x="125" y="204" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">podinfo-6.15.0.tgz</text>
  <text x="125" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">found on Artifact Hub</text>

  <rect x="290" y="70" width="410" height="300" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="495" y="92" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">helm, on the machine of the user (no server)</text>

  <rect x="305" y="108" width="180" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="395" y="132" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Chart</text>
  <text x="395" y="156" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Chart.yaml</text>
  <text x="395" y="176" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">templates/*.yaml</text>
  <text x="395" y="196" fill="#fbbf24" font-family="monospace" font-size="12" text-anchor="middle">values.yaml (defaults)</text>
  <text x="395" y="222" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">values.schema.json</text>

  <rect x="515" y="108" width="170" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="132" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Your values</text>
  <text x="600" y="152" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">-f prod.yaml  --set</text>

  <rect x="515" y="188" width="170" height="60" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="212" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Templates + values</text>
  <text x="600" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">= plain Kubernetes YAML</text>

  <rect x="305" y="268" width="380" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="495" y="292" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Commands</text>
  <text x="495" y="314" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">lint  template  install  upgrade  rollback</text>
  <text x="495" y="334" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">test  uninstall  package  push</text>

  <rect x="760" y="70" width="260" height="300" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="890" y="92" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Kubernetes cluster</text>

  <rect x="780" y="108" width="220" height="110" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="890" y="132" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Objects of the release</text>
  <text x="890" y="158" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Deployment dev-shop</text>
  <text x="890" y="178" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Service dev-shop</text>
  <text x="890" y="204" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">labelled managed-by: Helm</text>

  <rect x="780" y="238" width="220" height="112" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="890" y="262" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Release memory</text>
  <text x="890" y="286" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Secret sh.helm.release.v1.dev.v1</text>
  <text x="890" y="304" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Secret sh.helm.release.v1.dev.v2</text>
  <text x="890" y="328" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">chart, values, manifest of each revision</text>

  <line x1="230" y1="175" x2="303" y2="175" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="267" y="163" fill="#a78bfa" font-family="sans-serif" font-size="11" text-anchor="middle">1 pull</text>

  <line x1="487" y1="170" x2="513" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="170" x2="600" y2="186" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="182" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">2</text>

  <line x1="687" y1="218" x2="778" y2="170" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="735" y="184" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">3 apply</text>
  <line x1="687" y1="238" x2="778" y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="272" fill="#a78bfa" font-family="sans-serif" font-size="11" text-anchor="middle">4 record</text>

  <text x="520" y="410" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">upgrade = a new revision with other values or a newer chart, rollback = a new revision with the content of an old one</text>
  <text x="520" y="436" fill="#fbbf24" font-family="sans-serif" font-size="12" text-anchor="middle">A chart is a recipe that runs with the rights of the user: read it before installing it</text>
</svg>
