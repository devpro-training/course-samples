<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430">
  <rect x="0" y="0" width="1040" height="430" fill="#ffffff"/>
  <text x="520.0" y="40" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">From the hardware to the applications</text>
  <rect x="40" y="70" width="600" height="56" rx="10" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="340.0" y="95.0" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Applications</text>
  <text x="340.0" y="115.0" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">a web server, a database, a browser</text>
  <rect x="40" y="140" width="600" height="56" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="340.0" y="165.0" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Userland</text>
  <text x="340.0" y="185.0" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">the shell, the commands, the services (systemd)</text>
  <rect x="40" y="210" width="600" height="56" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="340.0" y="235.0" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Libraries</text>
  <text x="340.0" y="255.0" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">the C library, which turns calls into system calls</text>
  <line x1="40" y1="279" x2="640" y2="279" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="650" y="283" fill="#475569" font-family="monospace" font-size="12">system calls</text>
  <rect x="40" y="292" width="600" height="56" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="340.0" y="317.0" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kernel</text>
  <text x="340.0" y="337.0" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">processes, memory, files, drivers, network</text>
  <rect x="40" y="362" width="600" height="56" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="340.0" y="387.0" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Hardware</text>
  <text x="340.0" y="407.0" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">CPU, memory, disks, network cards</text>
  <line x1="770" y1="140" x2="770" y2="348" stroke="#b45309" stroke-width="2"/>
  <line x1="762" y1="140" x2="770" y2="140" stroke="#b45309" stroke-width="2"/>
  <line x1="762" y1="348" x2="770" y2="348" stroke="#b45309" stroke-width="2"/>
  <text x="786" y="214" fill="#b45309" font-family="sans-serif" font-size="16" font-weight="bold">A distribution</text>
  <text x="786" y="238" fill="#475569" font-family="sans-serif" font-size="13">kernel, libraries, commands</text>
  <text x="786" y="258" fill="#475569" font-family="sans-serif" font-size="13">+ a package manager</text>
  <text x="786" y="278" fill="#475569" font-family="sans-serif" font-size="13">+ an init system</text>
  <text x="786" y="298" fill="#475569" font-family="sans-serif" font-size="13">+ defaults and updates</text>
</svg>
