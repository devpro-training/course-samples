<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- The catalog, which describes what the pipeline publishes -->
  <rect x="270" y="20" width="460" height="64" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="46" text-anchor="middle" font-size="17" font-weight="600" fill="#7c3aed">Catalog</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#475569">subscription, branches and end of life, licence, vulnerability score</text>
  <line x1="390" y1="84" x2="390" y2="118" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="610" y1="84" x2="610" y2="118" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Source -->
  <rect x="20" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Source</text>
  <text x="125" y="182" text-anchor="middle" font-size="14" fill="#0f172a">upstream project</text>
  <text x="125" y="206" text-anchor="middle" font-size="14" fill="#0f172a">code and licence</text>
  <text x="125" y="240" text-anchor="middle" font-size="13" fill="#475569">PostgreSQL, MinIO,</text>
  <text x="125" y="260" text-anchor="middle" font-size="13" fill="#475569">a community</text>
  <text x="125" y="280" text-anchor="middle" font-size="13" fill="#475569">or a company</text>

  <!-- Build -->
  <rect x="270" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="375" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Build</text>
  <text x="375" y="182" text-anchor="middle" font-size="14" fill="#0f172a">the publisher's pipeline</text>
  <rect x="290" y="198" width="170" height="30" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="375" y="218" text-anchor="middle" font-size="13" fill="#b45309">application</text>
  <rect x="290" y="232" width="170" height="30" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="375" y="252" text-anchor="middle" font-size="13" fill="#b45309">the Linux behind it</text>
  <text x="375" y="290" text-anchor="middle" font-size="12" fill="#475569">Debian, SLE, Photon OS, Wolfi</text>

  <!-- Registry -->
  <rect x="520" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="625" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Registry</text>
  <text x="625" y="182" text-anchor="middle" font-size="14" fill="#0f172a">image and Helm chart</text>
  <text x="625" y="212" text-anchor="middle" font-size="13" fill="#16a34a">+ signature</text>
  <text x="625" y="234" text-anchor="middle" font-size="13" fill="#16a34a">+ SBOM</text>
  <text x="625" y="256" text-anchor="middle" font-size="13" fill="#16a34a">+ provenance</text>
  <text x="625" y="278" text-anchor="middle" font-size="13" fill="#16a34a">+ vulnerability scan</text>

  <!-- Team -->
  <rect x="770" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="875" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Team</text>
  <text x="875" y="182" text-anchor="middle" font-size="14" fill="#0f172a">verify the signature</text>
  <text x="875" y="206" text-anchor="middle" font-size="14" fill="#0f172a">pin the digest</text>
  <text x="875" y="230" text-anchor="middle" font-size="14" fill="#0f172a">mirror it</text>
  <text x="875" y="254" text-anchor="middle" font-size="14" fill="#0f172a">deploy</text>

  <line x1="230" y1="215" x2="266" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="215" x2="516" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="215" x2="766" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- The question to ask at each stage -->
  <line x1="20" y1="336" x2="980" y2="336" stroke="#cbd5e1"/>
  <text x="125" y="366" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">Who maintains it,</text>
  <text x="125" y="388" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">under which licence?</text>
  <text x="375" y="366" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">Who builds it,</text>
  <text x="375" y="388" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">on whose Linux?</text>
  <text x="625" y="366" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">What proves it,</text>
  <text x="625" y="388" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">for how long?</text>
  <text x="875" y="366" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">What if it disappears</text>
  <text x="875" y="388" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">or becomes paid?</text>
</svg>
