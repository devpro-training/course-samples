<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="520" fill="#0f172a"/>
  <text x="520" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">An ingress controller: one address in, many applications behind</text>

  <rect x="20" y="70" width="150" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="95" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Clients</text>
  <text x="95" y="126" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">shop.example.test</text>
  <text x="95" y="148" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">blog.example.test</text>
  <text x="95" y="170" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">app.example.test</text>
  <text x="95" y="210" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">DNS: one address</text>
  <text x="95" y="236" fill="#fbbf24" font-family="monospace" font-size="12" text-anchor="middle">:80 HTTP</text>
  <text x="95" y="258" fill="#fbbf24" font-family="monospace" font-size="12" text-anchor="middle">:443 HTTPS</text>
  <text x="95" y="294" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SNI + Host header</text>

  <rect x="215" y="70" width="610" height="330" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="520" y="92" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Kubernetes cluster</text>

  <rect x="240" y="120" width="190" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="335" y="146" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ingress controller</text>
  <text x="335" y="168" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">a reverse proxy: Traefik</text>
  <text x="335" y="194" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">ends TLS</text>
  <text x="335" y="214" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">picks a Service by host and path</text>
  <text x="335" y="234" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">balances between the Pods</text>
  <text x="335" y="256" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">HTTP inside the cluster</text>

  <rect x="480" y="110" width="320" height="64" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="640" y="134" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Service shop</text>
  <text x="640" y="156" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Pod  Pod  Pod</text>
  <rect x="480" y="186" width="320" height="64" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="640" y="210" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Service blog</text>
  <text x="640" y="232" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Pod</text>

  <rect x="240" y="300" width="190" height="80" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="335" y="324" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Ingress / HTTPRoute</text>
  <text x="335" y="346" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">rules, as data in the API</text>
  <text x="335" y="364" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">watched by the controller</text>

  <rect x="480" y="300" width="150" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="555" y="324" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Secret tls</text>
  <text x="555" y="346" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">tls.crt  tls.key</text>
  <text x="555" y="364" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">read by the controller</text>

  <rect x="660" y="300" width="140" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="730" y="324" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">cert-manager</text>
  <text x="730" y="346" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">issues, renews</text>
  <text x="730" y="364" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">from an Issuer</text>

  <line x1="172" y1="195" x2="238" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432" y1="150" x2="478" y2="142" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432" y1="230" x2="478" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335" y1="298" x2="335" y2="272" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="518" y1="298" x2="432" y2="262" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="658" y1="340" x2="632" y2="340" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="70" width="160" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="940" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Without it</text>
  <text x="940" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">ClusterIP: inside only</text>
  <text x="940" y="160" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">NodePort: a port per</text>
  <text x="940" y="178" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Service, on the nodes</text>
  <text x="940" y="208" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">LoadBalancer: an</text>
  <text x="940" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">address per Service</text>
  <text x="940" y="262" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">no name, no path,</text>
  <text x="940" y="280" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">no certificate</text>

  <rect x="20" y="440" width="1000" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="520" y="464" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">An Ingress or a Route is only data: nothing answers until a controller reads it</text>
  <text x="520" y="484" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">The same model holds for the Ingress API (frozen) and for the Gateway API (its successor)</text>
</svg>
