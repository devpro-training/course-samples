<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="470" fill="#0f172a"/>
  <text x="520" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">The test pyramid</text>

  <polygon points="520,70 600,170 440,170" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="520" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">End-to-end</text>

  <polygon points="436,176 604,176 684,276 356,276" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Integration</text>

  <polygon points="352,282 688,282 768,382 272,382" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="520" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Unit</text>

  <text x="800" y="124" fill="#fbbf24" font-family="monospace" font-size="13">Chrome + running app</text>
  <text x="800" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">everything, as a user sees it</text>
  <text x="800" y="164" fill="#94a3b8" font-family="sans-serif" font-size="12">e2e.sh</text>

  <text x="800" y="224" fill="#a78bfa" font-family="monospace" font-size="13">WebApplicationFactory</text>
  <text x="800" y="244" fill="#94a3b8" font-family="sans-serif" font-size="12">routes, JSON, services together</text>
  <text x="800" y="264" fill="#94a3b8" font-family="sans-serif" font-size="12">Shop.IntegrationTests</text>

  <text x="800" y="324" fill="#4ade80" font-family="monospace" font-size="13">xUnit + a fake</text>
  <text x="800" y="344" fill="#94a3b8" font-family="sans-serif" font-size="12">one class, no infrastructure</text>
  <text x="800" y="364" fill="#94a3b8" font-family="sans-serif" font-size="12">Shop.UnitTests</text>

  <line x1="150" y1="378" x2="150" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Slower</text>
  <text x="40" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Costlier</text>
  <text x="40" y="138" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Fewer</text>
  <text x="40" y="340" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">Fast</text>
  <text x="40" y="360" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">Cheap</text>
  <text x="40" y="380" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">Many</text>

  <line x1="30" y1="420" x2="1010" y2="420" stroke="#334155" stroke-width="2"/>
  <text x="520" y="448" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">The higher a test, the more it proves, and the harder it is to run, to read and to keep stable.</text>
</svg>
