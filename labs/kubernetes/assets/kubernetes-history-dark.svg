<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="330" fill="#0f172a"/>
  <text x="520" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">From Borg to a CNCF project</text>

  <line x1="40" y1="165" x2="1000" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="140" cy="165" r="10" fill="#fbbf24"/>
  <rect x="40" y="70" width="200" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="140" y="97" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Borg</text>
  <text x="140" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">inside Google, in C++</text>
  <text x="140" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">described in public</text>
  <text x="140" y="224" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">in April 2015</text>

  <circle cx="400" cy="165" r="10" fill="#38bdf8"/>
  <rect x="300" y="70" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="97" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">2014</text>
  <text x="400" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">open source, in Go</text>
  <text x="400" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">the best ideas of Borg,</text>
  <text x="400" y="224" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">for everyone</text>

  <circle cx="660" cy="165" r="10" fill="#4ade80"/>
  <rect x="560" y="70" width="200" height="70" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="660" y="97" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">21 July 2015</text>
  <text x="660" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">1.0, given to the CNCF</text>
  <text x="660" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">a neutral home</text>
  <text x="660" y="224" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">under the Linux Foundation</text>

  <circle cx="900" cy="165" r="10" fill="#a78bfa"/>
  <rect x="800" y="70" width="200" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="900" y="97" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">6 March 2018</text>
  <text x="900" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">first graduated CNCF project</text>
  <text x="900" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">broad adoption,</text>
  <text x="900" y="224" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">formal governance</text>

  <text x="520" y="290" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Sources: Kubernetes blog (23 April 2015), Kubernetes documentation, CNCF announcements of 21 July 2015 and 6 March 2018</text>
</svg>
