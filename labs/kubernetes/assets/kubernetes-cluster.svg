<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="430" fill="#ffffff"/>
  <text x="520" y="40" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">A cluster: a control plane and workers</text>

  <rect x="30" y="140" width="170" height="110" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="180" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Client</text>
  <text x="115" y="204" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">kubectl apply</text>
  <text x="115" y="224" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">a YAML file</text>

  <rect x="260" y="70" width="400" height="260" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="98" fill="#16a34a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Control plane: decides</text>
  <rect x="280" y="115" width="170" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="365" y="150" fill="#0284c7" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">kube-apiserver</text>
  <text x="365" y="174" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">the only door: the API</text>
  <rect x="480" y="115" width="160" height="90" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="150" fill="#7c3aed" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">datastore</text>
  <text x="560" y="174" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">etcd, or SQLite in k3s</text>
  <rect x="280" y="225" width="170" height="80" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="365" y="258" fill="#b45309" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">kube-scheduler</text>
  <text x="365" y="280" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">which node for a Pod</text>
  <rect x="480" y="225" width="160" height="80" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="560" y="251" fill="#b45309" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">controller-manager</text>
  <text x="560" y="280" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">desired = actual</text>
  <line x1="450" y1="160" x2="478" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="365" y1="205" x2="365" y2="223" stroke="#475569" stroke-width="2"/>

  <line x1="200" y1="195" x2="278" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="170" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">REST</text>

  <rect x="740" y="70" width="270" height="120" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="875" y="98" fill="#0284c7" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Worker node</text>
  <text x="875" y="124" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">kubelet, kube-proxy</text>
  <text x="875" y="146" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">container runtime</text>
  <text x="875" y="172" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">runs the Pods</text>
  <rect x="740" y="210" width="270" height="120" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="875" y="238" fill="#0284c7" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Worker node</text>
  <text x="875" y="264" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">kubelet, kube-proxy</text>
  <text x="875" y="286" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">container runtime</text>
  <text x="875" y="312" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">runs the Pods</text>

  <line x1="738" y1="130" x2="662" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="738" y1="270" x2="662" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="195" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">the kubelets</text>
  <text x="700" y="211" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">watch the API</text>

  <rect x="260" y="360" width="750" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="635" y="388" fill="#0f172a" font-family="sans-serif" font-size="14" text-anchor="middle">In k3s, one process runs the control plane and a node: a cluster of one machine, or many</text>
</svg>
