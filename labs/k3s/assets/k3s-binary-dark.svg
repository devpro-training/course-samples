<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="470" fill="#0f172a"/>
  <text x="520" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">k3s: one binary, started as a server or as an agent</text>

  <rect x="30" y="64" width="620" height="340" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="340" y="92" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">k3s server</text>

  <rect x="50" y="108" width="280" height="130" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="190" y="132" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Control plane, in the same process</text>
  <text x="190" y="158" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">API server, scheduler</text>
  <text x="190" y="178" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">controller manager</text>
  <text x="190" y="206" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">supervisor and API on port 6443</text>

  <rect x="350" y="108" width="280" height="130" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="490" y="132" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Datastore</text>
  <text x="490" y="158" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">Kine, the etcd API</text>
  <text x="490" y="180" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">SQLite: db/state.db</text>
  <text x="490" y="206" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">embedded etcd or a database for several servers</text>
  <line x1="330" y1="173" x2="348" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="256" width="580" height="60" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="340" y="280" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A node, as in the agent: runs the Pods</text>
  <text x="340" y="302" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">kubelet, containerd, Flannel (VXLAN), network policy controller</text>

  <rect x="50" y="332" width="580" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="340" y="356" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Packaged components, deployed from /var/lib/rancher/k3s/server/manifests</text>
  <text x="340" y="378" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">CoreDNS, Traefik, ServiceLB, local-path, metrics-server</text>

  <rect x="740" y="64" width="270" height="200" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="875" y="92" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">k3s agent</text>
  <text x="875" y="128" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">kubelet, containerd</text>
  <text x="875" y="150" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">Flannel (VXLAN)</text>
  <text x="875" y="172" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">client side load balancer</text>
  <text x="875" y="206" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">no datastore, no control plane</text>
  <text x="875" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">joins with a server address and a token</text>

  <line x1="738" y1="120" x2="652" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="112" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">TCP 6443</text>
  <line x1="738" y1="230" x2="652" y2="284" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="695" y="312" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">UDP 8472</text>

  <rect x="740" y="290" width="270" height="114" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="875" y="320" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">One file, under 100 MB</text>
  <text x="875" y="344" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">k3s server, k3s agent, kubectl,</text>
  <text x="875" y="362" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">crictl, ctr, token, secrets-encrypt,</text>
  <text x="875" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">etcd-snapshot, certificate</text>

  <rect x="30" y="420" width="980" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="520" y="443" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">Same Kubernetes API as any other distribution: only the packaging and the defaults change</text>
</svg>
