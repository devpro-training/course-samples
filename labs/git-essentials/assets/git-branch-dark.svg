<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330">
  <rect x="0" y="0" width="1040" height="330" fill="#0f172a"/>
  <text x="520" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">A branch is a pointer to a commit</text>

  <text x="250" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Before the merge</text>
  <line x1="130" y1="160" x2="330" y2="240" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="130" cy="160" r="18" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <text x="130" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Add README</text>
  <circle cx="330" cy="240" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="330" y="285" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Add greeting</text>
  <rect x="60" y="108" width="62" height="26" rx="5" fill="#4ade80"/>
  <text x="91" y="126" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">main</text>
  <rect x="360" y="212" width="160" height="26" rx="5" fill="#38bdf8"/>
  <text x="440" y="230" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">feature/greeting</text>

  <line x1="520" y1="70" x2="520" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="780" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">After git merge, a fast-forward</text>
  <line x1="640" y1="190" x2="840" y2="190" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="640" cy="190" r="18" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <text x="640" y="235" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Add README</text>
  <circle cx="840" cy="190" r="18" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <text x="840" y="235" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Add greeting</text>
  <rect x="770" y="108" width="62" height="26" rx="5" fill="#4ade80"/>
  <text x="801" y="126" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">main</text>
  <rect x="840" y="140" width="160" height="26" rx="5" fill="#38bdf8"/>
  <text x="920" y="158" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">feature/greeting</text>
  <text x="780" y="285" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">main had no new commit, so it just moves forward.</text>
</svg>
