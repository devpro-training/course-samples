<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- Code -->
  <rect x="20" y="90" width="210" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Code</text>
  <text x="125" y="152" text-anchor="middle" font-size="14" fill="#0f172a">the desired state</text>
  <text x="125" y="176" text-anchor="middle" font-size="13" fill="#16a34a">infra.json, *.tf, playbook</text>
  <text x="125" y="212" text-anchor="middle" font-size="12" fill="#475569">in Git, reviewed</text>
  <text x="125" y="232" text-anchor="middle" font-size="12" fill="#475569">scanned: trivy config</text>

  <!-- Plan -->
  <rect x="270" y="90" width="210" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="375" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Plan</text>
  <text x="375" y="152" text-anchor="middle" font-size="14" fill="#0f172a">code vs environment</text>
  <text x="375" y="180" text-anchor="middle" font-size="13" fill="#16a34a">+ create</text>
  <text x="375" y="200" text-anchor="middle" font-size="13" fill="#b45309">~ update</text>
  <text x="375" y="220" text-anchor="middle" font-size="13" fill="#7c3aed">- destroy</text>
  <text x="375" y="244" text-anchor="middle" font-size="12" fill="#475569">changes nothing</text>

  <!-- Apply -->
  <rect x="520" y="90" width="210" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="625" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Apply</text>
  <text x="625" y="152" text-anchor="middle" font-size="14" fill="#0f172a">makes the changes</text>
  <text x="625" y="180" text-anchor="middle" font-size="13" fill="#16a34a">in dependency order</text>
  <text x="625" y="212" text-anchor="middle" font-size="12" fill="#475569">run again: no changes</text>
  <text x="625" y="232" text-anchor="middle" font-size="12" fill="#475569">(idempotent)</text>

  <!-- Environment -->
  <rect x="770" y="90" width="210" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="875" y="120" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Environment</text>
  <text x="875" y="152" text-anchor="middle" font-size="14" fill="#0f172a">what really exists</text>
  <text x="875" y="180" text-anchor="middle" font-size="13" fill="#16a34a">servers, networks,</text>
  <text x="875" y="200" text-anchor="middle" font-size="13" fill="#16a34a">buckets, files</text>
  <text x="875" y="232" text-anchor="middle" font-size="12" fill="#475569">read by the plan</text>

  <line x1="230" y1="175" x2="266" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="175" x2="516" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="175" x2="766" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- State -->
  <rect x="270" y="310" width="460" height="52" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="333" text-anchor="middle" font-size="16" font-weight="600" fill="#7c3aed">State</text>
  <text x="500" y="352" text-anchor="middle" font-size="12" fill="#475569">what the tool manages: read by plan, written by apply, can hold secrets</text>
  <line x1="375" y1="310" x2="375" y2="264" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="625" y1="310" x2="625" y2="264" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Drift -->
  <text x="875" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Drift</text>
  <text x="875" y="62" text-anchor="middle" font-size="12" fill="#475569">a change made by hand</text>
  <line x1="875" y1="68" x2="875" y2="86" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <line x1="20" y1="392" x2="980" y2="392" stroke="#cbd5e1"/>
  <text x="500" y="416" text-anchor="middle" font-size="14" fill="#0f172a">The change is made in the code, the plan is read, then applied. The next plan lists the drift.</text>
</svg>
