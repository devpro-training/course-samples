<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="520" fill="#0f172a"/>
  <text x="520" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">k3d: the nodes of a cluster are Docker containers</text>

  <rect x="20" y="60" width="170" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="105" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">The machine</text>
  <text x="105" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">any system with Docker</text>
  <rect x="36" y="130" width="138" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="105" y="152" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">kubectl</text>
  <text x="105" y="170" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">k3d, docker</text>
  <rect x="36" y="196" width="138" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="105" y="218" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Browser</text>
  <text x="105" y="236" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">localhost:8080</text>
  <rect x="36" y="262" width="138" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="105" y="284" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">docker push</text>
  <text x="105" y="302" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">localhost:5000</text>
  <rect x="36" y="338" width="138" height="86" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="105" y="360" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">A folder</text>
  <text x="105" y="380" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">--volume</text>
  <text x="105" y="398" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">keeps the data</text>
  <text x="105" y="414" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">after a delete</text>

  <rect x="230" y="60" width="790" height="380" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="625" y="88" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Docker Engine: the network k3d-dev, one per cluster</text>

  <rect x="260" y="112" width="190" height="150" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="355" y="136" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">k3d-dev-serverlb</text>
  <text x="355" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">nginx, TCP only</text>
  <text x="355" y="182" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">6443 to the API</text>
  <text x="355" y="202" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">80 to Traefik</text>
  <text x="355" y="222" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">each --port adds one</text>
  <text x="355" y="246" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">the only published ports</text>

  <rect x="500" y="112" width="240" height="190" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="620" y="136" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">k3d-dev-server-0</text>
  <text x="620" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">k3s server: control plane + node</text>
  <text x="620" y="182" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Traefik, CoreDNS</text>
  <text x="620" y="202" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">local-path provisioner</text>
  <rect x="520" y="222" width="200" height="60" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="620" y="244" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Docker volume</text>
  <text x="620" y="264" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">/var/lib/rancher/k3s</text>

  <rect x="780" y="112" width="210" height="190" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="885" y="136" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">k3d-dev-agent-0</text>
  <text x="885" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">k3s agent: a node</text>
  <text x="885" y="182" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">kubelet, containerd</text>
  <rect x="800" y="222" width="170" height="60" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="885" y="244" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Docker volume</text>
  <text x="885" y="264" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">lost with the node</text>

  <rect x="260" y="330" width="260" height="84" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="390" y="354" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">k3d-registry.localhost</text>
  <text x="390" y="376" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">registry on the network of the cluster</text>
  <text x="390" y="396" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">nodes pull k3d-registry.localhost:5000</text>

  <rect x="560" y="330" width="430" height="84" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="775" y="354" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">At creation only: k3d-dev-tools</text>
  <text x="775" y="376" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">looks at the Docker environment (gateway, DNS), then is removed</text>
  <text x="775" y="396" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">host.k3d.internal = the gateway = the machine</text>

  <line x1="176" y1="156" x2="258" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217" y="148" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">6443</text>
  <line x1="176" y1="222" x2="258" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="176" y1="288" x2="258" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="190" x2="498" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="200" x2="778" y2="200" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="176" y1="380" x2="520" y2="270" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <rect x="20" y="460" width="1000" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="520" y="485" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">Same k3s and same Kubernetes API as a server: the nodes are only packaged as containers, and deleted with one command</text>
</svg>
