<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- The database, downloaded as OCI artifacts and cached -->
  <rect x="270" y="20" width="460" height="64" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="46" text-anchor="middle" font-size="17" font-weight="600" fill="#7c3aed">Databases</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#475569">OCI artifacts from mirror.gcr.io or ghcr.io, cached in ~/.cache/trivy</text>
  <line x1="625" y1="84" x2="625" y2="118" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Targets -->
  <rect x="20" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Target</text>
  <text x="125" y="182" text-anchor="middle" font-size="14" fill="#0f172a">container image</text>
  <text x="125" y="206" text-anchor="middle" font-size="14" fill="#0f172a">filesystem, repository</text>
  <text x="125" y="230" text-anchor="middle" font-size="14" fill="#0f172a">Kubernetes</text>
  <text x="125" y="254" text-anchor="middle" font-size="14" fill="#0f172a">SBOM</text>
  <text x="125" y="288" text-anchor="middle" font-size="12" fill="#475569">read from a registry or a folder</text>

  <!-- Analyze -->
  <rect x="270" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="375" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Analyze</text>
  <text x="375" y="178" text-anchor="middle" font-size="13" fill="#0f172a">what is inside</text>
  <rect x="290" y="190" width="170" height="26" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="375" y="208" text-anchor="middle" font-size="13" fill="#b45309">OS packages</text>
  <rect x="290" y="220" width="170" height="26" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="375" y="238" text-anchor="middle" font-size="13" fill="#b45309">language dependencies</text>
  <rect x="290" y="250" width="170" height="26" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="375" y="268" text-anchor="middle" font-size="13" fill="#b45309">config files, secrets</text>
  <text x="375" y="298" text-anchor="middle" font-size="12" fill="#475569">a name and a version each</text>

  <!-- Match -->
  <rect x="520" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="625" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Match</text>
  <text x="625" y="182" text-anchor="middle" font-size="14" fill="#0f172a">name + version</text>
  <text x="625" y="206" text-anchor="middle" font-size="14" fill="#0f172a">against the advisories</text>
  <text x="625" y="236" text-anchor="middle" font-size="13" fill="#16a34a">CVE, severity, fixed in</text>
  <text x="625" y="260" text-anchor="middle" font-size="13" fill="#16a34a">misconfiguration, secret</text>
  <text x="625" y="288" text-anchor="middle" font-size="12" fill="#475569">filtered by severity, ignore file</text>

  <!-- Report -->
  <rect x="770" y="120" width="210" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="875" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Report</text>
  <text x="875" y="182" text-anchor="middle" font-size="14" fill="#0f172a">table, JSON, SARIF</text>
  <text x="875" y="206" text-anchor="middle" font-size="14" fill="#0f172a">CycloneDX, SPDX</text>
  <text x="875" y="236" text-anchor="middle" font-size="13" fill="#16a34a">exit code</text>
  <text x="875" y="260" text-anchor="middle" font-size="13" fill="#16a34a">0 pass, 1 fail the gate</text>

  <line x1="230" y1="215" x2="266" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="215" x2="516" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="215" x2="766" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- What the result does not say -->
  <line x1="20" y1="336" x2="980" y2="336" stroke="#cbd5e1"/>
  <text x="500" y="366" text-anchor="middle" font-size="15" font-style="italic" fill="#0f172a">A match says what one database knows about what the analyzers found.</text>
  <text x="500" y="392" text-anchor="middle" font-size="14" fill="#475569">Not what is exploitable, not what the analyzers cannot see, not what another database knows: one tool among others.</text>
</svg>
