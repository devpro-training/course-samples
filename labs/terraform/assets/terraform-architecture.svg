<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- Configuration -->
  <rect x="20" y="130" width="200" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Configuration</text>
  <text x="120" y="190" text-anchor="middle" font-size="14" fill="#0f172a">HCL files, *.tf</text>
  <text x="120" y="214" text-anchor="middle" font-size="13" fill="#16a34a">resources, variables,</text>
  <text x="120" y="232" text-anchor="middle" font-size="13" fill="#16a34a">modules, outputs</text>
  <text x="120" y="262" text-anchor="middle" font-size="12" fill="#475569">in Git, reviewed</text>

  <!-- Core -->
  <rect x="280" y="130" width="230" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="395" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Terraform or tofu</text>
  <text x="395" y="190" text-anchor="middle" font-size="14" fill="#0f172a">the core, one binary</text>
  <text x="395" y="214" text-anchor="middle" font-size="13" fill="#16a34a">init, validate, plan, apply</text>
  <text x="395" y="238" text-anchor="middle" font-size="12" fill="#475569">orders the resources by</text>
  <text x="395" y="256" text-anchor="middle" font-size="12" fill="#475569">their references</text>

  <!-- Providers -->
  <rect x="570" y="130" width="190" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="665" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Providers</text>
  <text x="665" y="190" text-anchor="middle" font-size="14" fill="#0f172a">plugins, one per platform</text>
  <text x="665" y="214" text-anchor="middle" font-size="13" fill="#16a34a">azurerm, kubernetes,</text>
  <text x="665" y="232" text-anchor="middle" font-size="13" fill="#16a34a">github, local, random</text>
  <text x="665" y="262" text-anchor="middle" font-size="12" fill="#475569">pinned by the lock file</text>

  <!-- Real objects -->
  <rect x="810" y="130" width="170" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="895" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Real objects</text>
  <text x="895" y="190" text-anchor="middle" font-size="14" fill="#0f172a">behind an API</text>
  <text x="895" y="214" text-anchor="middle" font-size="13" fill="#16a34a">VMs, networks,</text>
  <text x="895" y="232" text-anchor="middle" font-size="13" fill="#16a34a">clusters, repos, files</text>
  <text x="895" y="262" text-anchor="middle" font-size="12" fill="#475569">read by the plan</text>

  <line x1="220" y1="205" x2="276" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="205" x2="566" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="205" x2="806" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Registry -->
  <rect x="520" y="20" width="290" height="56" rx="10" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="665" y="44" text-anchor="middle" font-size="16" font-weight="600" fill="#b45309">Registry</text>
  <text x="665" y="63" text-anchor="middle" font-size="12" fill="#475569">registry.terraform.io, registry.opentofu.org</text>
  <line x1="665" y1="76" x2="665" y2="126" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="680" y="106" font-size="12" fill="#b45309">init downloads</text>

  <!-- State -->
  <rect x="280" y="330" width="230" height="56" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="395" y="354" text-anchor="middle" font-size="16" font-weight="600" fill="#7c3aed">State, in a backend</text>
  <text x="395" y="373" text-anchor="middle" font-size="12" fill="#475569">a local file, or HTTP and MongoDB</text>
  <line x1="395" y1="326" x2="395" y2="284" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="410" y="308" font-size="12" fill="#7c3aed">read by plan, written by apply</text>

  <line x1="20" y1="408" x2="980" y2="408" stroke="#cbd5e1"/>
  <text x="500" y="424" text-anchor="middle" font-size="13" fill="#0f172a">The core compares the code with the state and the real objects, the plan lists the changes, and apply calls the providers.</text>
</svg>
