<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="430" fill="#ffffff"/>
  <text x="520" y="40" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Docker: client, daemon, registry</text>

  <rect x="30" y="100" width="170" height="110" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="140" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Client</text>
  <text x="115" y="164" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">docker run</text>
  <text x="115" y="184" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">docker build</text>

  <rect x="290" y="70" width="440" height="230" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="98" fill="#16a34a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Daemon: dockerd</text>
  <rect x="310" y="120" width="190" height="160" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="405" y="148" fill="#7c3aed" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Images</text>
  <text x="405" y="176" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">nginx:1.29-alpine</text>
  <text x="405" y="200" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">alpine:3.22</text>
  <text x="405" y="224" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">site:1</text>
  <text x="405" y="260" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">read-only layers</text>
  <rect x="530" y="120" width="180" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="620" y="148" fill="#b45309" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Containers</text>
  <text x="620" y="176" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">web</text>
  <text x="620" y="200" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">site</text>
  <text x="620" y="224" fill="#0f172a" font-family="monospace" font-size="13" text-anchor="middle">api</text>
  <text x="620" y="260" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">a layer to write, a process</text>
  <line x1="500" y1="200" x2="528" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="820" y="100" width="190" height="110" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="915" y="140" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Registry</text>
  <text x="915" y="164" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">Docker Hub</text>
  <text x="915" y="184" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">pull, push</text>

  <line x1="200" y1="155" x2="288" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="244" y="145" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">REST API</text>
  <line x1="730" y1="155" x2="818" y2="155" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="774" y="145" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">images</text>

  <rect x="290" y="330" width="440" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="510" y="357" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Linux kernel</text>
  <text x="510" y="377" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">namespaces isolate what a container sees, cgroups limit what it uses</text>
  <line x1="620" y1="300" x2="620" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
