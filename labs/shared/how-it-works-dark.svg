<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <rect x="0" y="0" width="640" height="220" fill="#0f172a"/>
  <text x="320" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">How a lab runs a command</text>

  <rect x="30" y="56" width="260" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Instructions</text>
  <text x="50" y="110" fill="#94a3b8" font-family="sans-serif" font-size="13">A Markdown file, with a block</text>
  <rect x="50" y="124" width="220" height="30" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="144" fill="#e2e8f0" font-family="monospace" font-size="13">echo "hello"</text>
  <rect x="206" y="128" width="58" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="235" y="144" fill="#38bdf8" font-family="sans-serif" font-size="12" text-anchor="middle">▶ Run</text>

  <line x1="290" y1="139" x2="346" y2="139" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="346,133 358,139 346,145" fill="#38bdf8"/>

  <rect x="360" y="56" width="250" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="485" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="380" y="124" fill="#4ade80" font-family="monospace" font-size="13">$ echo "hello"</text>
  <text x="380" y="146" fill="#e2e8f0" font-family="monospace" font-size="13">hello</text>
</svg>
