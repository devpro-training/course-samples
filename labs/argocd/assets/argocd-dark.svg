<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="500" fill="#0f172a"/>
  <text x="520" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Argo CD: a controller that compares Git with every cluster it manages</text>

  <rect x="20" y="80" width="190" height="150" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="115" y="108" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Git repository</text>
  <text x="115" y="134" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">apps/shop/*.yaml</text>
  <text x="115" y="154" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">bootstrap/*.yaml</text>
  <text x="115" y="182" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">plain YAML, Kustomize,</text>
  <text x="115" y="200" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Helm, Jsonnet</text>

  <rect x="20" y="250" width="190" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="115" y="278" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">People</text>
  <text x="115" y="302" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">web UI, argocd CLI,</text>
  <text x="115" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">pull requests</text>

  <rect x="270" y="60" width="480" height="400" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="510" y="84" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Namespace argocd of the hub cluster</text>

  <rect x="290" y="100" width="190" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="385" y="126" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Repository server</text>
  <text x="385" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">clones, renders</text>
  <text x="385" y="168" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">helm template, kustomize</text>

  <rect x="290" y="250" width="190" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="385" y="276" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">API server</text>
  <text x="385" y="298" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">UI, CLI, RBAC, SSO</text>
  <text x="385" y="318" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">admin, or Dex</text>

  <rect x="530" y="100" width="200" height="110" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="630" y="126" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Application controller</text>
  <text x="630" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">compares, syncs,</text>
  <text x="630" y="168" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">assesses health</text>
  <text x="630" y="192" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">OutOfSync, Healthy</text>

  <rect x="530" y="250" width="200" height="90" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="630" y="276" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ApplicationSet controller</text>
  <text x="630" y="298" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">makes Applications from</text>
  <text x="630" y="316" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">folders and clusters</text>

  <rect x="290" y="380" width="440" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="510" y="406" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Resources of the namespace</text>
  <text x="510" y="426" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Application, ApplicationSet, AppProject, Secrets</text>

  <rect x="800" y="80" width="220" height="110" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="910" y="106" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Hub cluster</text>
  <text x="910" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">in-cluster</text>
  <text x="910" y="150" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">kubernetes.default.svc</text>
  <text x="910" y="172" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Argo CD itself and its apps</text>

  <rect x="800" y="225" width="220" height="110" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="251" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Staging cluster</text>
  <text x="910" y="275" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">registered by a Secret</text>
  <text x="910" y="295" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">label env=staging</text>
  <text x="910" y="317" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">a token with cluster-admin</text>

  <rect x="800" y="370" width="220" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="910" y="396" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A new cluster</text>
  <text x="910" y="420" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">made and registered by</text>
  <text x="910" y="438" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Terraform, then filled</text>

  <line x1="212" y1="145" x2="288" y2="145" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="250" y="132" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">1 pull</text>
  <line x1="212" y1="295" x2="288" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="282" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">UI, CLI</text>
  <line x1="482" y1="145" x2="528" y2="145" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="505" y="132" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">2</text>
  <line x1="482" y1="275" x2="560" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="248" x2="630" y2="212" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="732" y1="130" x2="798" y2="130" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="732" y1="165" x2="798" y2="260" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="732" y1="190" x2="798" y2="400" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="765" y="118" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">3 apply</text>
  <text x="520" y="362" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">1 pull, 2 render, 3 apply and watch, 4 compare with the live state, repeat</text>

  <text x="520" y="486" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Everything Argo CD is told is a resource of its namespace, so it can be kept in Git as well.</text>
</svg>
