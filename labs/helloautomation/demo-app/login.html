<!doctype html>
<html>
<head><title>Demo App — Login</title></head>
<body style="font-family: sans-serif; max-width: 360px; margin: 60px auto;">
  <h1>Demo App</h1>
  <form id="login-form">
    <p><input name="username" placeholder="username" style="width: 100%; padding: 6px;" /></p>
    <p><input name="password" type="password" placeholder="password" style="width: 100%; padding: 6px;" /></p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault()
      window.location.href = 'users.html'
    })
  </script>
</body>
</html>
