<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- CMDB -->
  <rect x="20" y="20" width="270" height="70" rx="10" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="155" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#b45309">CMDB, cloud, directory</text>
  <text x="155" y="68" text-anchor="middle" font-size="12" fill="#475569">NetBox, ServiceNow, Azure, a JSON file</text>
  <line x1="155" y1="90" x2="155" y2="136" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="170" y="118" font-size="12" fill="#b45309">queried by a plugin or a script</text>

  <!-- Inventory -->
  <rect x="20" y="140" width="270" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="155" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Inventory</text>
  <text x="155" y="198" text-anchor="middle" font-size="14" fill="#0f172a">which hosts, in which groups</text>
  <text x="155" y="222" text-anchor="middle" font-size="13" fill="#16a34a">static file, or dynamic</text>
  <text x="155" y="240" text-anchor="middle" font-size="13" fill="#16a34a">group_vars, host_vars</text>
  <text x="155" y="266" text-anchor="middle" font-size="12" fill="#475569">the hosts are never typed twice</text>

  <!-- Control node -->
  <rect x="350" y="140" width="290" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="495" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Control node</text>
  <text x="495" y="198" text-anchor="middle" font-size="14" fill="#0f172a">ansible-playbook, a Python program</text>
  <text x="495" y="222" text-anchor="middle" font-size="13" fill="#16a34a">playbook, roles, templates</text>
  <text x="495" y="240" text-anchor="middle" font-size="13" fill="#16a34a">tasks call modules</text>
  <text x="495" y="266" text-anchor="middle" font-size="12" fill="#475569">in Git, reviewed, no agent to install</text>

  <!-- Managed nodes -->
  <rect x="710" y="140" width="270" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="845" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Managed nodes</text>
  <text x="845" y="198" text-anchor="middle" font-size="14" fill="#0f172a">Linux, with SSH and Python</text>
  <text x="845" y="222" text-anchor="middle" font-size="13" fill="#16a34a">web1, web2, db1</text>
  <text x="845" y="240" text-anchor="middle" font-size="13" fill="#16a34a">files, packages, services</text>
  <text x="845" y="266" text-anchor="middle" font-size="12" fill="#475569">the state is read on each run</text>

  <line x1="290" y1="210" x2="346" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="210" x2="706" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="673" y="196" text-anchor="middle" font-size="12" fill="#475569">SSH</text>

  <!-- Modules -->
  <rect x="440" y="330" width="400" height="56" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="354" text-anchor="middle" font-size="16" font-weight="600" fill="#7c3aed">Modules, small programs</text>
  <text x="640" y="373" text-anchor="middle" font-size="12" fill="#475569">pushed to the node, run, reported ok or changed, removed</text>
  <line x1="845" y1="326" x2="845" y2="284" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>
  <line x1="495" y1="326" x2="495" y2="284" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow-purple)"/>

  <line x1="20" y1="408" x2="980" y2="408" stroke="#cbd5e1"/>
  <text x="500" y="424" text-anchor="middle" font-size="13" fill="#0f172a">The inventory says where, the playbook says what, and the modules make a node match it.</text>
</svg>
