title: "Ansible"
description: "Configure machines from a playbook: an inventory, static or read from a CMDB, tasks and modules, idempotence, check mode, handlers, variables per environment, roles, Vault and a linter."
duration: 30
tags:
  - infrastructure
  - devops
  - ansible
sidebarWidth: 620
backend: container
workdir: ~/lab
# Every version, URL and identity of the course, so a step refers to one by name.
env:
  # https://docs.ansible.com/projects/ansible/latest/reference_appendices/release_and_maintenance.html
  # The newest series that runs on the Python 3.11 of the lab image: 2.20 and 2.21 need Python 3.12 or newer.
  ANSIBLE_CORE_VERSION: 2.19.14
  # https://pypi.org/project/ansible-lint/
  ANSIBLE_LINT_VERSION: 26.10.0
  # https://pypi.org/project/pip/#files
  PIP_VERSION: 26.2.1
  PIP_WHEEL_URL: https://files.pythonhosted.org/packages/f3/6e/1736e5b4ae2b778ef2f81c47d797de9f891d4d8acb047a24ca37a60294dd/pip-26.2.1-py3-none-any.whl
  PIP_WHEEL_SHA256: 71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e
  # The CMDB of the lab, a JSON document served on this port, with the URL kept equal to it by hand.
  CMDB_PORT: 8800
  CMDB_URL: http://127.0.0.1:8800/cmdb.json
