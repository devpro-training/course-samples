<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430">
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="430" fill="#0f172a"/>
  <text x="520" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Cluster API in Rancher: Turtles installs providers, and imports what they create</text>
  <rect x="20" y="80" width="210" height="150" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="125" y="104" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Declared, in Git or kubectl</text>
  <text x="125" y="124" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">CAPIProvider aws</text>
  <text x="125" y="141" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">CAPIProvider rke2</text>
  <text x="125" y="158" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">ClusterClass</text>
  <text x="125" y="175" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Cluster + label</text>
  <text x="125" y="192" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">rancher-auto-import</text>
  <rect x="270" y="60" width="470" height="300" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="505" y="84" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle"></text>
  <text x="505" y="84" fill="#38bdf8" font-family="sans-serif" font-size="13" text-anchor="middle">The local cluster</text>
  <rect x="290" y="100" width="200" height="110" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="390" y="124" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Turtles operator</text>
  <text x="390" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">installs and upgrades</text>
  <text x="390" y="162" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">the providers</text>
  <text x="390" y="180" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">cattle-turtles-system</text>
  <rect x="520" y="100" width="200" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="620" y="124" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cluster API core</text>
  <text x="620" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Cluster, MachineDeployment,</text>
  <text x="620" y="162" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Machine</text>
  <text x="620" y="180" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">cattle-capi-system</text>
  <rect x="290" y="230" width="430" height="110" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="505" y="254" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Providers</text>
  <text x="505" y="274" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">infrastructure: CAPA, CAPZ, CAPG, CAPV, CAPD</text>
  <text x="505" y="292" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">bootstrap and control plane: CAPRKE2, kubeadm</text>
  <text x="505" y="310" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">one namespace per provider: capa-system, ...</text>
  <rect x="800" y="80" width="220" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="910" y="104" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cloud or hypervisor</text>
  <text x="910" y="124" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">machines, networks,</text>
  <text x="910" y="142" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">load balancers</text>
  <rect x="800" y="230" width="220" height="130" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="910" y="254" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">New cluster</text>
  <text x="910" y="274" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">registered in Rancher</text>
  <text x="910" y="292" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">like any other</text>
  <text x="910" y="310" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">cattle-cluster-agent</text>
  <text x="910" y="327" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">installed by Turtles</text>
  <line x1="232" y1="155" x2="288" y2="155" stroke="#a78bfa" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="492" y1="155" x2="518" y2="155" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="620" y1="212" x2="620" y2="228" stroke="#38bdf8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="722" y1="270" x2="798" y2="150" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="722" y1="290" x2="798" y2="290" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="798" y1="345" x2="742" y2="345" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="770" y="380" fill="#4ade80" font-family="sans-serif" font-size="12" text-anchor="middle">agent tunnel</text>
  <text x="520" y="400" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Rancher's own RKE2 provisioning is built on the same Cluster API; an imported cluster has no CAPI object.</text>
</svg>
