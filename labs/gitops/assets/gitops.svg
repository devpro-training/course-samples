<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="460" fill="#ffffff"/>
  <text x="520" y="36" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">GitOps: the cluster pulls its desired state from Git</text>

  <rect x="20" y="90" width="170" height="170" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="118" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">People</text>
  <text x="105" y="146" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">edit the YAML files</text>
  <text x="105" y="168" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">open a pull request</text>
  <text x="105" y="190" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">review and merge</text>
  <text x="105" y="226" fill="#b45309" font-family="monospace" font-size="12" text-anchor="middle">no cluster access</text>

  <rect x="285" y="90" width="230" height="170" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="118" fill="#7c3aed" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Git server</text>
  <text x="400" y="140" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">repository platform</text>
  <text x="400" y="166" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">apps/shop/*.yaml</text>
  <text x="400" y="186" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">envs/dev/kustomization.yaml</text>
  <text x="400" y="216" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">branch main = desired state</text>
  <text x="400" y="238" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">every version kept</text>

  <rect x="610" y="70" width="410" height="250" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="815" y="92" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Kubernetes cluster</text>

  <rect x="630" y="110" width="170" height="130" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="136" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Reconciler</text>
  <text x="715" y="160" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">fetch, compare,</text>
  <text x="715" y="178" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">apply, repeat</text>
  <text x="715" y="206" fill="#475569" font-family="monospace" font-size="11" text-anchor="middle">Argo CD, Flux, Fleet</text>
  <text x="715" y="224" fill="#475569" font-family="monospace" font-size="11" text-anchor="middle">here: reconcile.sh</text>

  <rect x="840" y="110" width="160" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="920" y="136" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Actual state</text>
  <text x="920" y="164" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">Deployment shop</text>
  <text x="920" y="184" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">Service shop</text>
  <text x="920" y="214" fill="#b45309" font-family="sans-serif" font-size="12" text-anchor="middle">drift is undone</text>

  <line x1="190" y1="160" x2="283" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="237" y="148" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">1 merge</text>

  <line x1="628" y1="190" x2="517" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="572" y="176" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">2 pull, read only</text>

  <line x1="802" y1="160" x2="838" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="820" y="150" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">3</text>
  <line x1="838" y1="200" x2="802" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="216" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">4</text>

  <path d="M 105 262 L 105 380 L 920 380 L 920 322" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="520" y="368" fill="#b45309" font-family="sans-serif" font-size="12" text-anchor="middle">Push, for comparison: a pipeline holds the credential of the cluster and applies from outside</text>

  <text x="520" y="425" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">3 apply and prune    4 observe the cluster, and start again every few seconds</text>
</svg>
