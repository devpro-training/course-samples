<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="500" fill="#0f172a"/>
  <text x="520" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">One repository, one folder per cluster, one Flux per cluster</text>
  <rect x="20" y="60" width="300" height="400" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="170" y="86" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Git repository fleet</text>
  <text x="170" y="110" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">clusters/hub/</text>
  <text x="170" y="129" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">clusters/staging/</text>
  <text x="170" y="148" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">apps/shop/   (shared)</text>
  <text x="170" y="167" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">apps/infra/  (shared)</text>
  <text x="170" y="186" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">tenants/team-a/</text>
  <text x="170" y="205" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">.sops.yaml (two recipients)</text>
  <rect x="420" y="70" width="260" height="170" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="550" y="96" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cluster hub</text>
  <text x="550" y="120" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Flux follows clusters/hub</text>
  <text x="550" y="139" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">shop: 3 replicas</text>
  <text x="550" y="158" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">key: age.agekey</text>
  <text x="550" y="177" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">sops-age: hub key</text>
  <rect x="420" y="290" width="260" height="170" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="550" y="316" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cluster staging</text>
  <text x="550" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Flux follows clusters/staging</text>
  <text x="550" y="359" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">shop: 1 replica, a patch</text>
  <text x="550" y="378" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">key: staging.agekey</text>
  <text x="550" y="397" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">sops-age: staging key</text>
  <rect x="780" y="70" width="240" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="900" y="96" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Shared by both</text>
  <text x="900" y="120" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">the same Deployment file</text>
  <text x="900" y="139" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">the same encrypted Secret</text>
  <text x="900" y="158" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">each key opens it</text>
  <rect x="780" y="290" width="240" height="170" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="900" y="316" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Other ways</text>
  <text x="900" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">spec.kubeConfig: one Flux</text>
  <text x="900" y="359" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">applies to remote clusters</text>
  <text x="900" y="378" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">a hub, or one per cluster</text>
  <line x1="322" y1="150" x2="418" y2="150" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="370" y="140" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">pull</text>
  <line x1="322" y1="360" x2="418" y2="360" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowa)"/>
  <text x="370" y="350" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">pull</text>
  <line x1="682" y1="150" x2="778" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682" y1="360" x2="778" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="486" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Each cluster pulls its own folder: no cluster holds a credential for another, and a cluster that was off catches up.</text>
</svg>
