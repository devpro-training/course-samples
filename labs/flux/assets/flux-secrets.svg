<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>
  <text x="520" y="34" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Secrets with SOPS and age: Git holds ciphertext, only the cluster holds the key</text>
  <rect x="20" y="80" width="200" height="120" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="106" fill="#7c3aed" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A person</text>
  <text x="120" y="130" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">secret.yaml in clear</text>
  <text x="120" y="149" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">sops --encrypt</text>
  <text x="120" y="168" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">with the public key</text>
  <rect x="20" y="260" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="286" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Key pair (age)</text>
  <text x="120" y="310" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">public key: .sops.yaml</text>
  <text x="120" y="329" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">private key: age.agekey</text>
  <text x="120" y="348" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">made once per cluster</text>
  <rect x="290" y="80" width="230" height="140" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="405" y="106" fill="#7c3aed" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Git repository</text>
  <text x="405" y="130" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">kind: Secret</text>
  <text x="405" y="149" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">name: shop-db</text>
  <text x="405" y="168" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">password: ENC[AES256_GCM,...]</text>
  <text x="405" y="187" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">keys readable, values not</text>
  <rect x="580" y="60" width="440" height="400" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="800" y="86" fill="#0284c7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">The cluster</text>
  <rect x="600" y="100" width="200" height="120" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="126" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Kustomize controller</text>
  <text x="700" y="150" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">decryption: provider: sops</text>
  <text x="700" y="169" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">secretRef: sops-age</text>
  <text x="700" y="188" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">decrypts when it applies</text>
  <rect x="840" y="100" width="160" height="120" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="920" y="126" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Secret sops-age</text>
  <text x="920" y="150" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">age.agekey</text>
  <text x="920" y="169" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">the private key</text>
  <text x="920" y="188" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">namespace flux-system</text>
  <rect x="600" y="280" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="306" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Secret shop-db</text>
  <text x="700" y="330" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">the value, in clear</text>
  <text x="700" y="349" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">namespace shop</text>
  <rect x="840" y="280" width="160" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="920" y="306" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Pods</text>
  <text x="920" y="330" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">read it as env</text>
  <text x="920" y="349" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">or a volume</text>
  <line x1="222" y1="140" x2="288" y2="140" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowp)"/>
  <text x="255" y="128" fill="#7c3aed" font-family="sans-serif" font-size="11" text-anchor="middle">commit</text>
  <line x1="120" y1="260" x2="120" y2="202" stroke="#b45309" stroke-width="2" marker-end="url(#arrowa)"/>
  <text x="150" y="238" fill="#b45309" font-family="sans-serif" font-size="11" text-anchor="middle">encrypts</text>
  <line x1="522" y1="150" x2="598" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="560" y="140" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">pull</text>
  <line x1="840" y1="160" x2="802" y2="160" stroke="#b45309" stroke-width="2" marker-end="url(#arrowa)"/>
  <text x="820" y="150" fill="#b45309" font-family="sans-serif" font-size="11" text-anchor="middle">key</text>
  <line x1="700" y1="222" x2="700" y2="278" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="725" y="255" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">apply</text>
  <line x1="802" y1="330" x2="838" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="222" y1="335" x2="838" y2="205" stroke="#b45309" stroke-width="2" marker-end="url(#arrowa)"/>
  <text x="400" y="322" fill="#b45309" font-family="sans-serif" font-size="11" text-anchor="middle">given once to the cluster</text>
  <text x="520" y="486" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">The public key only encrypts. The private key is given to the cluster once, by hand, and kept elsewhere too.</text>
</svg>
