<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>
  <text x="520" y="34" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Flux: controllers that pull sources and apply them to the cluster they run in</text>
  <rect x="20" y="70" width="190" height="110" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="96" fill="#7c3aed" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Git repository</text>
  <text x="115" y="120" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">clusters/hub/*.yaml</text>
  <text x="115" y="139" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">apps/shop/*.yaml</text>
  <text x="115" y="158" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">plain YAML, Kustomize</text>
  <rect x="20" y="200" width="190" height="80" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="226" fill="#7c3aed" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Helm repository, OCI</text>
  <text x="115" y="250" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">charts and artifacts</text>
  <text x="115" y="269" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">a bucket, as well</text>
  <rect x="20" y="320" width="190" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="115" y="346" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">People</text>
  <text x="115" y="370" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">git push, pull requests,</text>
  <text x="115" y="389" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">the flux CLI</text>
  <rect x="270" y="50" width="500" height="420" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="520" y="76" fill="#0284c7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Namespace flux-system of the cluster</text>
  <rect x="290" y="100" width="200" height="110" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="126" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Source controller</text>
  <text x="390" y="150" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">fetches, verifies, caches</text>
  <text x="390" y="169" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">GitRepository, HelmRepository,</text>
  <text x="390" y="188" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">OCIRepository, Bucket</text>
  <rect x="550" y="100" width="200" height="110" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="126" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Kustomize controller</text>
  <text x="650" y="150" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">builds and applies, prunes</text>
  <text x="650" y="169" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">decrypts with SOPS</text>
  <text x="650" y="188" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">Kustomization</text>
  <rect x="550" y="240" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="266" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Helm controller</text>
  <text x="650" y="290" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">installs, upgrades, rolls back</text>
  <text x="650" y="309" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">HelmRelease</text>
  <rect x="290" y="240" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="390" y="266" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Notification controller</text>
  <text x="390" y="290" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">events out: Slack, Git</text>
  <text x="390" y="309" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">webhooks in: Receiver</text>
  <rect x="290" y="370" width="460" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="520" y="396" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Objects of the namespace</text>
  <text x="520" y="420" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">Kustomization, HelmRelease, GitRepository, Provider, Alert</text>
  <rect x="800" y="100" width="220" height="110" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="126" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">The cluster</text>
  <text x="910" y="150" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">Deployments, Services,</text>
  <text x="910" y="169" fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">Secrets, CRDs, RBAC</text>
  <text x="910" y="188" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">drift is corrected</text>
  <rect x="800" y="240" width="220" height="90" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="2"/>
  <text x="910" y="266" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Image automation</text>
  <text x="910" y="290" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">optional controllers</text>
  <text x="910" y="309" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">commit new tags to Git</text>
  <line x1="212" y1="125" x2="288" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="250" y="125" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">pull</text>
  <line x1="212" y1="240" x2="288" y2="185" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="492" y1="155" x2="548" y2="155" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="520" y="146" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">artifact</text>
  <line x1="420" y1="212" x2="640" y2="242" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="752" y1="150" x2="798" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="775" y="140" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">apply</text>
  <line x1="752" y1="290" x2="798" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="115" y1="318" x2="115" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="300" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">push</text>
  <text x="520" y="486" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">No server holds a credential for the cluster: the cluster holds the credential to read the repository.</text>
</svg>
