title: "GitHub essentials"
description: "Read a public GitHub repository with a browser, Git and the REST API, then follow a pull request and a workflow."
duration: 30
tags:
  - github
  - git
  - beginner
sidebarWidth: 620
backend: container
workdir: ~/lab
env:
  # The lab image is Debian 12, and its user has no root access, so packages are unpacked rather than installed.
  # Debian removes a superseded package from the pool, so this follows https://packages.debian.org/bookworm/git
  DEBIAN_MIRROR: https://deb.debian.org/debian
  GIT_DEB: git_2.39.5-0+deb12u3_amd64.deb
  # https://packages.debian.org/bookworm/less
  LESS_DEB: less_590-2.1~deb12u2_amd64.deb
  # https://docs.github.com/en/rest, the API is read without an account, at 60 requests per hour and per IP address.
  GITHUB_API: https://api.github.com
  # https://docs.github.com/en/rest/about-the-rest-api/api-versions
  GITHUB_API_VERSION: "2026-03-10"
  # This repository, to read the repository page, the history and the branches.
  COURSE_REPO: devpro-training/course-samples
  # https://github.com/actions/checkout, a widely used repository with pull requests and workflows.
  # A tag and a pull request already merged never change, which keeps the checks stable.
  SAMPLE_REPO: actions/checkout
  SAMPLE_TAG: v4.2.2
  SAMPLE_PR: "1"
  SAMPLE_WORKFLOW: .github/workflows/test.yml
