<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- Clients -->
  <text x="135" y="24" text-anchor="middle" font-size="13" fill="#475569">CLIENTS</text>
  <rect x="20" y="36" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="135" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Azure portal</text>
  <text x="135" y="78" text-anchor="middle" font-size="12" fill="#475569">portal.azure.com, Cloud Shell</text>
  <rect x="20" y="100" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="135" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Azure CLI</text>
  <text x="135" y="142" text-anchor="middle" font-size="12" fill="#475569">az, PowerShell</text>
  <rect x="20" y="164" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="135" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Bicep, ARM template</text>
  <text x="135" y="206" text-anchor="middle" font-size="12" fill="#475569">az deployment ...</text>
  <rect x="20" y="228" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="135" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Terraform</text>
  <text x="135" y="270" text-anchor="middle" font-size="12" fill="#475569">azurerm provider</text>
  <rect x="20" y="292" width="230" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="135" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">SDKs, REST</text>
  <text x="135" y="334" text-anchor="middle" font-size="12" fill="#475569">.NET, Python, Go, curl</text>
  <line x1="250" y1="190" x2="336" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="62" x2="336" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="126" x2="336" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="254" x2="336" y2="254" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="318" x2="336" y2="258" stroke="#475569" stroke-width="2"/>

  <!-- Entra -->
  <rect x="340" y="36" width="300" height="84" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
  <text x="490" y="64" text-anchor="middle" font-size="17" font-weight="600" fill="#0284c7">Microsoft Entra ID</text>
  <text x="490" y="86" text-anchor="middle" font-size="13" fill="#0f172a">the tenant: users, groups, applications</text>
  <text x="490" y="106" text-anchor="middle" font-size="12" fill="#475569">login.microsoftonline.com</text>
  <line x1="490" y1="214" x2="490" y2="124" stroke="#0284c7" stroke-width="2" marker-start="url(#arrow-blue)"/>
  <text x="502" y="176" font-size="12" fill="#0284c7">access token</text>

  <!-- ARM -->
  <rect x="340" y="220" width="300" height="124" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="248" text-anchor="middle" font-size="17" font-weight="600" fill="#7c3aed">Azure Resource Manager</text>
  <text x="490" y="270" text-anchor="middle" font-size="12" fill="#475569">management.azure.com, the control plane</text>
  <text x="490" y="294" text-anchor="middle" font-size="13" fill="#16a34a">authenticates, authorizes (Azure RBAC)</text>
  <text x="490" y="312" text-anchor="middle" font-size="13" fill="#16a34a">policy, locks, tags, deployments</text>
  <text x="490" y="332" text-anchor="middle" font-size="12" fill="#475569">one API, the same result from every tool</text>

  <!-- Providers -->
  <text x="855" y="24" text-anchor="middle" font-size="13" fill="#475569">RESOURCE PROVIDERS</text>
  <rect x="740" y="36" width="240" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="860" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Microsoft.Compute</text>
  <text x="860" y="78" text-anchor="middle" font-size="12" fill="#475569">virtual machines</text>
  <rect x="740" y="100" width="240" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="860" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Microsoft.Network</text>
  <text x="860" y="142" text-anchor="middle" font-size="12" fill="#475569">virtual networks</text>
  <rect x="740" y="164" width="240" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="860" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Microsoft.Storage</text>
  <text x="860" y="206" text-anchor="middle" font-size="12" fill="#475569">storage accounts</text>
  <line x1="640" y1="270" x2="736" y2="62" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="270" x2="736" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="270" x2="736" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Resources -->
  <rect x="740" y="250" width="240" height="94" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#16a34a">Resources in regions</text>
  <text x="860" y="300" text-anchor="middle" font-size="12" fill="#0f172a">westeurope, francecentral, ...</text>
  <text x="860" y="320" text-anchor="middle" font-size="12" fill="#475569">in a resource group, in a subscription</text>
  <line x1="860" y1="220" x2="860" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data plane -->
  <path d="M 860 348 L 860 376 L 250 376 L 250 350" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="555" y="394" text-anchor="middle" font-size="12" fill="#b45309">data plane: an application talks to the resource itself, for example &lt;account&gt;.blob.core.windows.net</text>

  <line x1="20" y1="410" x2="980" y2="410" stroke="#cbd5e1"/>
  <text x="500" y="429" text-anchor="middle" font-size="13" fill="#0f172a">Every tool asks Microsoft Entra ID for a token, then calls Azure Resource Manager.</text>
</svg>
