title: "VS Code"
description: "Use Visual Studio Code: layout, commands, settings, extensions, source control and debugging."
duration: 30
tags:
  - ide
  - vscode
  - beginner
sidebarWidth: 560
backend: container
workdir: ~/lab
env:
  # The lab image is Debian 12, and its user has no root access, so packages are unpacked rather than installed.
  # Debian removes a superseded package from the pool, so these follow https://packages.debian.org/bookworm/git and https://packages.debian.org/bookworm/less
  DEBIAN_MIRROR: https://deb.debian.org/debian
  GIT_DEB: git_2.39.5-0+deb12u3_amd64.deb
  LESS_DEB: less_590-2.1~deb12u2_amd64.deb
  # The identity commits are recorded with, which a tenant or an account can set to its own.
  GIT_USER_NAME: Ada Lovelace
  GIT_USER_EMAIL: ada@example.com
  # https://github.com/coder/code-server/releases
  CODE_SERVER_VERSION: 4.140.0
