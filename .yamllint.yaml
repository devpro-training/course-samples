extends: default
# ref. https://yamllint.readthedocs.io/en/stable/configuration.html
rules:
  document-start: disable
  line-length:
    level: warning
    max: 180
  truthy: disable
  indentation:
    spaces: 2
    indent-sequences: whatever
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
